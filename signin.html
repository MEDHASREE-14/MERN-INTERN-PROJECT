
<!DOCTYPE html>
<html>
<head>
    <title>Swiggy - Sign In</title>

    <style>
        body {
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        #outer-box {
            width: 400px;
            height: 480px;
            background-color: white;
            margin: 80px auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 0px 10px gray;
        }

        h1 {
            color: #fc8019;
            text-align: center;
            font-size: 35px;
        }

        h2 {
            text-align: center;
            color: #333333;
        }

        p {
            text-align: center;
            color: gray;
            font-size: 15px;
        }

        input {
            width: 90%;
            padding: 15px;
            margin: 12px 0px;
            border: 1px solid gray;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 98%;
            padding: 15px;
            background-color: #fc8019;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            margin-top: 15px;
        }

        button:hover {
            background-color: #e66f10;
        }

        a {
            color: #fc8019;
            text-decoration: none;
        }

        .terms {
            font-size: 12px;
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <div id="outer-box">

        <h1>Swiggy</h1>

        <h2>Login or Sign Up</h2>

        <p>Enter your mobile number to continue</p>

        <form>
            <input type="tel" placeholder="Enter your mobile number"
                   maxlength="10" required>

            <button type="submit">Continue</button>
        </form>

        <p class="terms">
            By continuing, you agree to our
            <a href="#">Terms & Conditions</a>
            and
            <a href="#">Privacy Policy</a>.
        </p>

    </div>

</body>
</html>
