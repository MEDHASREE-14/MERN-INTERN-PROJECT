<!DOCTYPE html>
<html>
    <head>FLEX MODEL
        <title>Flex Model</title>
        <style>
            #main{
                justify-content: center;
                align-items: center;
            }
            #outer-box{
                background-color: rgb(251, 201, 140);
                border:10px solid;
                width: 800px;
                height:500px;
                display:flex;
                flex-wrap:wrap;
                gap:30px;
                justify-content: center;
                align-items: center;
                
            }
            .small-boxes{
                border:5px solid brown;
                width:150px;
                height: 150px;
            }
            #box1{
                background-color: rgb(91, 197, 197);
            }
            #box2{
                background-color: rgb(195, 243, 243);
            }
            #box3{
                background-color: rgb(249, 207, 200);

            }
            #box4{
                background-color: rgb(252, 219, 246);

            }
        </style>
    </head>
    <body>
        <div id="main">
        <div id="outer-box">
            <div class ="small-boxes" id="box1">

            </div>
            <div class ="small-boxes" id="box2">
                
            </div>
            <div class ="small-boxes" id="box3">
                
            </div>
            <div class ="small-boxes" id="box4">
                
            </div>
        </div>
        </div>
    </body>
</html>
